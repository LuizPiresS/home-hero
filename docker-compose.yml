services:
  postgres:
    image: postgres:16-alpine
    container_name: home-hero-postgres
    environment:
      POSTGRES_DB: home_hero
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - home-hero-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d home_hero"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  home-hero-postgres-data:
